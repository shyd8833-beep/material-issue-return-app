
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10243a">
  <meta name="description" content="Material Issue and Return Management System">
  <title>Material Management</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div>
          <div class="brand-name">Material Management</div>
          <div class="brand-subtitle">Issue & Return Control Center</div>
        </div>
      </div>

      <div class="top-actions">
        <span id="connectionStatus" class="status-pill">Connecting...</span>
        <button id="installButton" class="install-button" hidden>
          Install App
        </button>
        <button id="logoutButton" class="logout-button" hidden>
          Logout
        </button>
      </div>
    </header>

    <main>
      <section id="loginScreen" class="login-screen">
        <div class="login-card">
          <div class="login-icon">M</div>
          <h1>Welcome Back</h1>
          <p>Sign in to Material Management</p>

          <form id="loginForm">
            <label for="username">Username</label>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="Enter username"
              required
            >

            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter password"
              required
            >

            <button id="loginButton" type="submit" class="primary-button">
              Sign In
            </button>
          </form>

          <p id="loginMessage" class="message" role="status"></p>
          <div class="login-footer">Secure Material Issue & Return System</div>
        </div>
      </section>

      <section id="mainScreen" hidden>
        <aside class="sidebar">
          <div class="sidebar-heading">WORKSPACE</div>

          <button class="nav-button active" data-page="dashboard">
            <span>▦</span> Dashboard
          </button>
          <button class="nav-button" data-page="issue">
            <span>↗</span> Material Issue
          </button>
          <button class="nav-button" data-page="inward">
            <span>↓</span> Material Inward
          </button>
          <button class="nav-button" data-page="return">
            <span>↩</span> Material Return
          </button>
          <button class="nav-button" data-page="stock">
            <span>▤</span> Live Stock
          </button>
          <button class="nav-button" data-page="history">
            <span>◷</span> Transaction History
          </button>

          <div class="sidebar-heading">MANAGEMENT</div>

          <button class="nav-button" data-page="people">
            <span>♙</span> People
          </button>
          <button class="nav-button" data-page="items">
            <span>▣</span> Items
          </button>
          <button class="nav-button" data-page="reports">
            <span>▥</span> Reports
          </button>
          <button class="nav-button" data-page="voice">
            <span>🎙</span> Voice Agent
          </button>
          <button class="nav-button" data-page="settings">
            <span>⚙</span> Admin Settings
          </button>
        </aside>

        <div class="workspace">
          <div class="page-heading">
            <div>
              <div class="breadcrumb">Workspace / <span id="breadcrumbPage">Dashboard</span></div>
              <h1 id="pageTitle">Dashboard</h1>
              <p id="pageSubtitle">Your material management overview</p>
            </div>
            <div class="user-info">
              <div id="userAvatar" class="avatar">U</div>
              <div>
                <strong id="loggedInUser">User</strong>
                <small id="loggedInRole">User</small>
              </div>
            </div>
          </div>

          <div id="pageContent" class="page-content">
            <div class="loading-panel">Loading dashboard...</div>
          </div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status"></div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
